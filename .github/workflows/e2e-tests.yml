name: E2E Tests
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options:
        - dev
        - stable
        - stable-blocked
        - client
        default: dev
      product_sha:
        type: string
        required: true
      producer_sha:
        type: string
        required: true
      install_ha:
        type: boolean
        default: true
      client_core:
        type: choice
        options:
        - 2026.8.0
        - 2026.11.0
        default: 2026.8.0
      client_repo:
        type: choice
        options:
        - source
        - mirror
        default: source
permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  TESTCONTAINERS_RYUK_DISABLED: 'true'
jobs:
  qualify:
    if: ${{ github.repository == 'julienld/ha-mcp-dev' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: tooling
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.4
    - run: uv python install 3.13
    - name: Assert real release handoffs
      id: release
      run: uv run -s tooling/.qa/verify.py "$PHASE" --product-sha "$PRODUCT_SHA" --producer-sha "$PRODUCER_SHA"
      env:
        PHASE: ${{ inputs.phase == 'client' && 'dev' || inputs.phase }}
        PRODUCT_SHA: ${{ inputs.product_sha }}
        PRODUCER_SHA: ${{ inputs.producer_sha }}
    - name: Download the exact HA inputs
      if: ${{ inputs.install_ha }}
      run: uv run -s tooling/.qa/prepare_ha.py --input qa-simple-zip-result.json --output "$RUNNER_TEMP/simple-zip-ha"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: ${{ inputs.install_ha || inputs.phase == 'client' }}
      with:
        repository: julienld/ha-mcp-simple-release-qa-20261108
        ref: ${{ steps.release.outputs.source_tag }}
        path: source
        fetch-depth: 0
        submodules: true
        persist-credentials: false
    - name: Install existing test dependencies
      if: ${{ inputs.install_ha || inputs.phase == 'client' }}
      working-directory: source
      run: uv sync --all-extras --dev
    - name: Pull the actual Core image
      if: ${{ inputs.install_ha }}
      run: docker pull ghcr.io/home-assistant/home-assistant:2026.11.0
    - name: Install and exercise the published ZIP
      id: ha
      if: ${{ inputs.install_ha }}
      working-directory: source/tests
      run: uv run pytest src/e2e/workflows/embedded/test_embedded_update_path.py -p ha_plugin -m update_path -k working --tb=short
        -v
      env:
        E2E_UPDATE_PATH: '1'
        HAMCP_ENV_FILE: tests/.env.test
        PYTHONPATH: ${{ github.workspace }}/tooling/.qa
        QA_HA_SUBJECT: ${{ github.workspace }}/source
        QA_HA_ARCHIVE: ${{ runner.temp }}/simple-zip-ha/ha_mcp_tools.zip
        QA_HA_INPUT: ${{ runner.temp }}/simple-zip-ha/ha-input.json
        QA_HA_RECEIPT: ${{ runner.temp }}/simple-zip-ha/ha-install-receipt.json
    - name: Report actual HA outcome
      if: ${{ always() && inputs.install_ha && steps.release.outcome == 'success' }}
      run: uv run -s tooling/.qa/report_ha.py
      env:
        QA_HA_OUTCOME: ${{ steps.ha.outcome }}
    - name: Install isolated UI test driver
      if: ${{ inputs.phase == 'client' }}
      working-directory: source
      run: uv pip install --python .venv/bin/python playwright==1.56.0
    - name: Pull the client compatibility Core
      if: ${{ inputs.phase == 'client' }}
      run: docker pull "ghcr.io/home-assistant/home-assistant:$CORE"
      env:
        CORE: ${{ inputs.client_core }}
    - name: Observe the actual installer UI
      id: client
      if: ${{ inputs.phase == 'client' }}
      working-directory: source/tests
      run: uv run --no-sync pytest "$GITHUB_WORKSPACE/tooling/.qa/test_client_selection.py" -o addopts= -o log_cli=false --timeout-method=thread
        --tb=short -q
      env:
        PYTHONPATH: ${{ github.workspace }}/tooling/.qa:${{ github.workspace }}/source
        QA_CLIENT_SOURCE: ${{ github.workspace }}/source
        QA_CLIENT_CORE: ${{ inputs.client_core }}
        QA_CLIENT_REPO: ${{ inputs.client_repo }}
        QA_CLIENT_OUTPUT: ${{ runner.temp }}/simple-zip-client
    - name: Report client exploration
      if: ${{ always() && inputs.phase == 'client' && steps.release.outcome == 'success' }}
      run: uv run -s tooling/.qa/report_client.py
      env:
        QA_CLIENT_OUTCOME: ${{ steps.client.outcome }}
        QA_CLIENT_CORE: ${{ inputs.client_core }}
        QA_CLIENT_REPO: ${{ inputs.client_repo }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: simple-zip-qualification
        path: 'qa-simple-zip-result.json

          ${{ runner.temp }}/simple-zip-ha/*.json

          ${{ runner.temp }}/simple-zip-client/*'
        retention-days: 30
